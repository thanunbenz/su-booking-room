services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: su-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sumbenz
      POSTGRES_PASSWORD: sumbenz2806
      POSTGRES_DB: su_booking_room
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumbenz -d su_booking_room"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - su-booking-network

  # Backend (Go + Fiber)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: su-booking-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: sumbenz
      DB_PASSWORD: sumbenz2806
      DB_NAME: su_booking_room
      PORT: 8000
      TZ: Asia/Bangkok
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - su-booking-network
    volumes:
      - ./backend:/app
    command: ["./main"]

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: su-booking-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - su-booking-network

networks:
  su-booking-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

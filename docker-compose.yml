services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: su-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sumbenz
      POSTGRES_PASSWORD: sumbenz2806
      POSTGRES_DB: su_booking_room
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumbenz -d su_booking_room"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - su-booking-network

networks:
  su-booking-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
